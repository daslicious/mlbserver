<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>mlbserver</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg-deep: #06060a;
  --bg-bar: rgba(11, 11, 18, 0.92);
  --bg-surface: #1a1a24;
  --bg-card: #111118;
  --bg-input: #0e0e16;
  --border: #1c1c28;
  --border-hover: #2a2a3a;
  --text-primary: #eae8e4;
  --text-secondary: #9895a0;
  --text-muted: #5c596a;
  --amber: #e8a84c;
  --amber-dim: #b07830;
  --amber-glow: rgba(232, 168, 76, 0.08);
  --radius-sm: 6px;
  --font: 'Outfit', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', 'Menlo', monospace;
  --ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg-deep);
  color: var(--text-primary);
  font-family: var(--font);
  overflow: hidden;
}

a { color: var(--amber); text-decoration: none; }
a:hover { color: #f0be70; }

.player-viewport {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: #000;
}

video {
  width: 100%; height: calc(100vh - 48px);
  outline: none; background: #000;
  object-fit: contain;
}
video:not([data-has-video]) {
  height: 120px; max-width: 900px;
  background: var(--bg-card);
  border-radius: var(--radius-sm);
  object-fit: initial;
}

/* Bottom controls */
.controls {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
  background: var(--bg-bar);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  padding: 8px 16px;
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  transition: opacity 400ms var(--ease), transform 400ms var(--ease);
}
.controls::before {
  content: ''; position: absolute; top: -1px; left: 10%; right: 10%; height: 1px;
  background: linear-gradient(90deg, transparent, var(--amber-dim), transparent); opacity: 0.4;
}
.controls.hidden { opacity: 0; transform: translateY(8px); pointer-events: none; }

.ctrl-btn {
  font-family: var(--font-mono); font-size: 0.72rem; font-weight: 500;
  padding: 5px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: transparent; color: var(--text-muted); cursor: pointer;
  transition: all 150ms var(--ease); white-space: nowrap; user-select: none; line-height: 1;
}
.ctrl-btn:hover { border-color: var(--border-hover); color: var(--text-secondary); background: var(--bg-surface); }
.ctrl-btn.active { color: var(--amber); border-color: var(--amber-dim); background: var(--amber-glow); }

.back-btn {
  font-family: var(--font); font-weight: 500; font-size: 0.75rem;
  padding: 5px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: transparent; color: var(--text-muted); cursor: pointer;
  transition: all 150ms var(--ease); margin-right: 6px;
}
.back-btn:hover { color: var(--text-secondary); border-color: var(--border-hover); }

.ctrl-sep { width: 1px; height: 18px; background: var(--border); margin: 0 4px; flex-shrink: 0; }
.rate-group { display: flex; gap: 2px; }
.audio-group { display: flex; gap: 2px; }

/* Stream switcher — top right */
.stream-panel {
  position: fixed; top: 12px; right: 12px; z-index: 20;
  transition: opacity 400ms var(--ease), transform 400ms var(--ease);
}
.stream-panel.hidden { opacity: 0; transform: translateY(-4px); pointer-events: none; }

.stream-toggle {
  font-family: var(--font-mono); font-size: 0.7rem; font-weight: 500;
  padding: 6px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--bg-bar); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  color: var(--text-muted); cursor: pointer; transition: all 150ms var(--ease);
}
.stream-toggle:hover { color: var(--text-secondary); border-color: var(--border-hover); }

.stream-list {
  display: none; margin-top: 6px;
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 6px 0; min-width: 200px; max-height: 60vh; overflow-y: auto;
}
.stream-list.open { display: block; }

.stream-item {
  display: block; padding: 6px 14px;
  font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-secondary);
  cursor: pointer; transition: all 100ms var(--ease); border: none; background: none; width: 100%; text-align: left;
}
.stream-item:hover { background: var(--bg-surface); color: var(--text-primary); }
.stream-item.active { color: var(--amber); }

.stream-divider { height: 1px; background: var(--border); margin: 4px 0; }

.stream-label {
  padding: 4px 14px; font-size: 0.58rem; font-weight: 600; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 0.1em;
}

/* Gear popup — above controls */
.gear-popup {
  display: none;
  position: absolute; bottom: 100%; right: 0; margin-bottom: 4px;
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 12px 14px; min-width: 260px; max-width: 340px; z-index: 15;
}
.gear-popup.open { display: block; }

.gear-section { margin-bottom: 10px; }
.gear-section:last-child { margin-bottom: 0; }

.gear-label {
  font-size: 0.6rem; font-weight: 600; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 5px;
}

.gear-pills { display: flex; flex-wrap: wrap; gap: 3px; }

.gear-pill {
  font-family: var(--font-mono); font-size: 0.65rem; font-weight: 500;
  padding: 3px 7px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: transparent; color: var(--text-muted); cursor: pointer;
  transition: all 120ms var(--ease); line-height: 1.3; text-align: center;
}
.gear-pill:hover { border-color: var(--border-hover); color: var(--text-secondary); }
.gear-pill.active { color: var(--amber); border-color: var(--amber-dim); background: var(--amber-glow); }

.gear-pill-bw { display: block; font-size: 0.5rem; color: var(--text-muted); opacity: 0.6; }

/* Radio sync slider */
.radio-slider {
  -webkit-appearance: none; appearance: none; width: 140px; height: 4px;
  background: var(--border); border-radius: 2px; outline: none; cursor: pointer;
}
.radio-slider::-webkit-slider-thumb {
  -webkit-appearance: none; width: 14px; height: 14px;
  background: var(--amber); border-radius: 50%; cursor: pointer;
}
.radio-slider::-moz-range-thumb {
  width: 14px; height: 14px;
  background: var(--amber); border-radius: 50%; border: none; cursor: pointer;
}

.loading-msg {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  z-index: 5; pointer-events: none;
}
.loading-msg span {
  font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-muted);
  opacity: 0; animation: fade-in 600ms 500ms forwards;
}
@keyframes fade-in { to { opacity: 1; } }

@media (max-width: 600px) {
  .controls { padding: 6px 10px; gap: 4px; }
  .ctrl-btn { font-size: 0.65rem; padding: 4px 7px; }
  .back-btn { font-size: 0.68rem; padding: 4px 8px; }
  .gear-popup { min-width: 220px; }
}
</style>
</head>
<body>

<div class="player-viewport">
  <video id="video" playsinline muted controls autoplay></video>
</div>

<div class="loading-msg" id="loadingMsg"><span>Loading stream...</span></div>

<!-- Stream switcher — top right -->
<div class="stream-panel" id="streamPanel">
  <button class="stream-toggle" id="streamToggle" onclick="toggleStreamList()">Streams</button>
  <div class="stream-list" id="streamList"></div>
</div>

<audio id="radioAudio" style="display:none;"></audio>

<!-- Bottom controls -->
<div class="controls" id="controls">
  <button class="back-btn" onclick="goBack()">Back</button>
  <div class="ctrl-sep"></div>
  <button class="ctrl-btn" onclick="skip(-30)">-30s</button>
  <button class="ctrl-btn" onclick="skip(-10)">-10s</button>
  <button class="ctrl-btn" onclick="skip(10)">+10s</button>
  <button class="ctrl-btn" onclick="skip(30)">+30s</button>
  <div class="ctrl-sep"></div>
  <div class="rate-group" id="rateGroup">
    <button class="ctrl-btn" onclick="setRate(0.5)">0.5x</button>
    <button class="ctrl-btn active" onclick="setRate(1)">1x</button>
    <button class="ctrl-btn" onclick="setRate(1.25)">1.25x</button>
    <button class="ctrl-btn" onclick="setRate(1.5)">1.5x</button>
    <button class="ctrl-btn" onclick="setRate(2)">2x</button>
  </div>
  <div class="ctrl-sep"></div>
  <button class="ctrl-btn" id="muteBtn" onclick="toggleMute()">Unmute</button>
  <button class="ctrl-btn" id="airplayBtn" onclick="doAirPlay()" style="display:none">AirPlay</button>
  <div class="audio-group" id="audioGroup"></div>
  <div class="ctrl-sep" id="radioSep" style="display:none;"></div>
  <div id="radioControls" style="display:none; align-items:center; gap:4px;">
    <button class="ctrl-btn" id="radioToggle" onclick="toggleRadioPanel()">Radio</button>
  </div>
  <div style="margin-left: auto;"></div>
  <button class="ctrl-btn" id="gearBtn" onclick="toggleGear()" title="Quality settings">Quality</button>

  <!-- Quality popup -->
  <div class="gear-popup" id="gearPopup">
    <div class="gear-section" id="gearResSection">
      <div class="gear-label">Resolution</div>
      <div class="gear-pills" id="gearResolution"></div>
    </div>
    <div class="gear-section">
      <div class="gear-label">Skip</div>
      <div class="gear-pills" id="gearSkip"></div>
    </div>
    <div class="gear-section">
      <div class="gear-label">Pad</div>
      <div class="gear-pills" id="gearPad"></div>
    </div>
  </div>

  <!-- Radio popup -->
  <div id="radioPopup" style="display:none; position:absolute; bottom:100%; left:0; right:0; background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 16px; z-index:15;">
    <div style="display:flex; flex-wrap:wrap; gap:4px; margin-bottom:8px;" id="radioFeeds"></div>
    <div style="display:flex; align-items:center; gap:8px;">
      <span style="font-size:0.6rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.08em;">Sync</span>
      <input type="range" class="radio-slider" id="radioSlider" min="-30" max="30" step="0.1" value="0" oninput="onRadioSlider(this.value)">
      <span id="radioSyncDisplay" style="font-family:var(--font-mono); font-size:0.72rem; color:var(--text-primary); min-width:40px; text-align:center;">0.0s</span>
      <button class="ctrl-btn" id="radioStopBtn" onclick="stopRadio()" style="display:none; margin-left:auto;">Stop</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
// Wrap fetch to strip credentials from URLs
var _origFetch = window.fetch;
window.fetch = function(input, init) {
  if (typeof input === 'string' && input.startsWith('/')) {
    input = window.location.origin + input;
  }
  return _origFetch.call(this, input, init);
};

(function() {
  var video = document.getElementById('video');
  var controls = document.getElementById('controls');
  var streamPanel = document.getElementById('streamPanel');
  var loadingMsg = document.getElementById('loadingMsg');
  var muteBtn = document.getElementById('muteBtn');
  var airplayBtn = document.getElementById('airplayBtn');
  var audioGroup = document.getElementById('audioGroup');
  var rateGroup = document.getElementById('rateGroup');
  var streamList = document.getElementById('streamList');
  var streamToggle = document.getElementById('streamToggle');
  var gearPopup = document.getElementById('gearPopup');

  var params = new URLSearchParams(window.location.search);
  var startFrom = params.get('startFrom') || 'Beginning';
  var contentProtect = params.get('content_protect') || '';
  var gamePk = params.get('gamePk') || '';
  var currentMediaId = params.get('mediaId') || '';

  // Stream options — loaded from user prefs, overridable via gear popup
  var streamOpts = {
    resolution: 'adaptive',
    skip: 'off',
    skipAdjust: 0,
    pad: 'off'
  };

  // Load user preferences for stream options
  fetch('/api/user/preferences').then(function(r) {
    if (r.ok) return r.json();
    return {};
  }).then(function(prefs) {
    if (prefs.resolution) streamOpts.resolution = prefs.resolution;
    if (prefs.skip) streamOpts.skip = prefs.skip;
    if (prefs.skipAdjust !== undefined) streamOpts.skipAdjust = prefs.skipAdjust;
    if (prefs.pad) streamOpts.pad = prefs.pad;
    // Now load the stream with these prefs
    if (!streamURL && currentMediaId) {
      streamURL = buildStreamURL(currentMediaId);
      loadStream(streamURL);
    }
    buildGearPopup();
  }).catch(function() { buildGearPopup(); });

  function saveStreamPrefs() {
    fetch('/api/user/preferences').then(function(r) {
      if (r.ok) return r.json(); return {};
    }).then(function(prefs) {
      prefs.resolution = streamOpts.resolution;
      prefs.skip = streamOpts.skip;
      prefs.skipAdjust = streamOpts.skipAdjust;
      prefs.pad = streamOpts.pad;
      fetch('/api/user/preferences', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(prefs)
      });
    }).catch(function() {});
  }

  // Build stream URL with current options
  function buildStreamURL(mediaId, mediaType) {
    var url = '/stream.m3u8?mediaId=' + mediaId;
    if (streamOpts.resolution !== 'adaptive') url += '&resolution=' + streamOpts.resolution;
    if (streamOpts.skip !== 'off') {
      url += '&skip=' + streamOpts.skip;
      if (streamOpts.skipAdjust) url += '&skip_adjust=' + streamOpts.skipAdjust;
    }
    if (streamOpts.pad !== 'off') url += '&pad=' + streamOpts.pad;
    if (mediaType && mediaType !== 'MLBTV' && url.indexOf('force_vod') === -1) {
      url += '&force_vod=on';
    }
    if (gamePk) url += '&gamePk=' + gamePk;
    if (contentProtect) url += '&content_protect=' + contentProtect;
    return url;
  }

  // Build initial stream URL (for src/msrc/highlight_src — non-mediaId sources)
  var streamURL = '';
  if (params.get('src')) {
    streamURL = params.get('src');
    if (contentProtect) streamURL += (streamURL.indexOf('?') >= 0 ? '&' : '?') + 'content_protect=' + contentProtect;
  } else if (params.get('msrc')) {
    streamURL = '/stream.m3u8?src=' + encodeURIComponent(params.get('msrc'));
    if (contentProtect) streamURL += '&content_protect=' + contentProtect;
  } else if (params.get('highlight_src')) {
    streamURL = params.get('highlight_src');
    if (contentProtect) streamURL += (streamURL.indexOf('?') >= 0 ? '&' : '?') + 'content_protect=' + contentProtect;
  } else if (params.get('event')) {
    streamURL = '/stream.m3u8?event=' + params.get('event');
    if (contentProtect) streamURL += '&content_protect=' + contentProtect;
  }
  // Note: if currentMediaId, streamURL is built after prefs load

  if (window.WebKitPlaybackTargetAvailabilityEvent) airplayBtn.style.display = '';

  // HLS instance
  var hls = null;

  function loadStream(url) {
    loadingMsg.style.display = '';
    loadingMsg.querySelector('span').textContent = 'Loading stream...';
    loadingMsg.querySelector('span').style.opacity = '0';
    loadingMsg.querySelector('span').style.animation = 'none';
    void loadingMsg.querySelector('span').offsetWidth;
    loadingMsg.querySelector('span').style.animation = 'fade-in 600ms 500ms forwards';

    if (hls) { hls.destroy(); hls = null; }
    video.removeAttribute('data-has-video');
    video.controls = true;

    if (Hls.isSupported()) {
      var hlsConfig = {};
      if (startFrom === 'Live') hlsConfig.liveSyncDuration = 32400;
      hls = new Hls(hlsConfig);
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, function(event, data) {
        loadingMsg.style.display = 'none';
        if (data.levels && data.levels.some(function(l) { return l.videoCodec; })) {
          video.setAttribute('data-has-video', '');
          document.getElementById('gearBtn').style.display = '';
          document.getElementById('gearResSection').style.display = '';
        } else {
          video.removeAttribute('data-has-video');
          video.controls = true;
          // Hide resolution for audio-only, hide Quality entirely if nothing useful
          document.getElementById('gearResSection').style.display = 'none';
          if (url.indexOf('force_vod') === -1) {
            var vodUrl = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'force_vod=on';
            hls.destroy();
            hls = new Hls(hlsConfig);
            hls.loadSource(vodUrl);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
              video.controls = true;
              video.play().catch(function() {});
            });
            window._hls = hls;
            return;
          }
        }
        function seekToStart() {
          if (startFrom === 'Live') {
            if (video.duration && isFinite(video.duration)) {
              video.currentTime = video.duration - 10;
            } else if (hls.liveSyncPosition) {
              video.currentTime = hls.liveSyncPosition;
            }
          } else if (startFrom === 'Beginning') {
            video.currentTime = 0;
          }
        }
        video.addEventListener('canplay', function onCanPlay() {
          video.removeEventListener('canplay', onCanPlay);
          video.play().then(seekToStart).catch(function() {});
        });
        if (video.readyState >= 3) {
          video.play().then(seekToStart).catch(function() {});
        }
      });
      hls.on(Hls.Events.AUDIO_TRACKS_UPDATED, function(event, data) {
        audioGroup.innerHTML = '';
        if (data.audioTracks.length > 1) {
          data.audioTracks.forEach(function(track, i) {
            var btn = document.createElement('button');
            btn.className = 'ctrl-btn' + (i === hls.audioTrack ? ' active' : '');
            btn.textContent = track.name || ('Audio ' + (i + 1));
            btn.onclick = function() { hls.audioTrack = i; updateAudioButtons(i); };
            audioGroup.appendChild(btn);
          });
        }
      });
      hls.on(Hls.Events.ERROR, function(event, data) {
        if (data.fatal) loadingMsg.querySelector('span').textContent = 'Stream error';
      });
      window._hls = hls;
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = url;
      video.addEventListener('loadedmetadata', function() {
        loadingMsg.style.display = 'none';
        video.play().catch(function() {});
      }, { once: true });
    }
  }

  // Load initial stream (non-mediaId sources load immediately)
  if (streamURL) loadStream(streamURL);

  // Gear popup — build from config
  var showResolutions = ['adaptive', '1080p60', '720p60', '720p', '540p', '360p'];

  function buildGearPopup() {
    fetch('/api/config' + (contentProtect ? '?content_protect=' + contentProtect : '')).then(function(r) { return r.json(); }).then(function(cfg) {
      var vo = cfg.validOptions;

      // Resolution — practical subset
      var resHtml = '';
      vo.resolutions.forEach(function(r, i) {
        if (showResolutions.indexOf(r) === -1) return;
        var cls = r === streamOpts.resolution ? ' active' : '';
        var bw = vo.displayBandwidths[i] ? '<span class="gear-pill-bw">' + vo.displayBandwidths[i] + '</span>' : '';
        resHtml += '<button class="gear-pill' + cls + '" onclick="setOpt(\'resolution\',\'' + r + '\')">' + r + bw + '</button>';
      });
      document.getElementById('gearResolution').innerHTML = resHtml;

      // Skip
      var skipHtml = '';
      vo.skip.forEach(function(s) {
        var cls = s === streamOpts.skip ? ' active' : '';
        skipHtml += '<button class="gear-pill' + cls + '" onclick="setOpt(\'skip\',\'' + s + '\')">' + s + '</button>';
      });
      document.getElementById('gearSkip').innerHTML = skipHtml;

      // Pad
      var padHtml = '';
      vo.pad.forEach(function(p) {
        var cls = p === streamOpts.pad ? ' active' : '';
        padHtml += '<button class="gear-pill' + cls + '" onclick="setOpt(\'pad\',\'' + p + '\')">' + p + '</button>';
      });
      document.getElementById('gearPad').innerHTML = padHtml;
    }).catch(function() {});
  }

  window.setOpt = function(key, value) {
    streamOpts[key] = value;
    saveStreamPrefs();
    buildGearPopup(); // refresh active states
    // Reload stream with new options
    if (currentMediaId) {
      streamURL = buildStreamURL(currentMediaId);
      loadStream(streamURL);
    }
  };

  window.toggleGear = function() {
    gearPopup.classList.toggle('open');
  };

  // Fetch game broadcasts for stream switcher
  if (gamePk) {
    var apiUrl = '/api/games?' + (params.get('date') ? 'date=' + params.get('date') : '');
    if (contentProtect) apiUrl += (apiUrl.includes('?') ? '&' : '?') + 'content_protect=' + contentProtect;
    fetch(apiUrl).then(function(r) { return r.json(); }).then(function(data) {
      if (!data.games) return;
      var game = data.games.find(function(g) { return g.gamePk === gamePk; });
      if (!game) return;

      document.title = game.away.abbreviation + ' @ ' + game.home.abbreviation + ' — mlbserver';

      var html = '';
      var tvFeeds = game.broadcasts.filter(function(b) { return b.mediaType === 'MLBTV' && b.language === 'en'; });
      var audioFeeds = game.broadcasts.filter(function(b) { return b.mediaType === 'Audio'; });
      var spanishFeeds = game.broadcasts.filter(function(b) { return b.mediaType === 'Spanish' || (b.mediaType === 'MLBTV' && b.language === 'es'); });

      if (tvFeeds.length > 0) {
        html += '<div class="stream-label">TV</div>';
        tvFeeds.forEach(function(b) {
          var label = (b.isNational ? 'NATIONAL' : (b.homeAway === 'home' ? 'Home' : 'Away')) + ' — ' + b.callSign;
          var isActive = b.mediaStateCode === 'MEDIA_ON' || b.mediaStateCode === 'MEDIA_ARCHIVE' || game.status.abstractGameState === 'Final';
          var cls = 'stream-item' + (b.mediaId === currentMediaId ? ' active' : '');
          if (isActive) {
            html += '<button class="' + cls + '" onclick="switchStream(\'' + b.mediaId + '\',\'' + b.mediaType + '\')">' + label + '</button>';
          } else {
            html += '<div class="' + cls + '">' + label + '</div>';
          }
        });
      }

      if (audioFeeds.length > 0) {
        html += '<div class="stream-divider"></div><div class="stream-label">Radio</div>';
        audioFeeds.forEach(function(b) {
          var label = (b.homeAway === 'home' ? 'Home' : 'Away') + ' — ' + b.callSign;
          var isActive = b.mediaStateCode === 'MEDIA_ON' || b.mediaStateCode === 'MEDIA_ARCHIVE' || game.status.abstractGameState === 'Final';
          var cls = 'stream-item' + (b.mediaId === currentMediaId ? ' active' : '');
          if (isActive) {
            html += '<button class="' + cls + '" onclick="switchStream(\'' + b.mediaId + '\',\'' + b.mediaType + '\')">' + label + '</button>';
          } else {
            html += '<div class="' + cls + '">' + label + '</div>';
          }
        });
      }

      if (spanishFeeds.length > 0) {
        html += '<div class="stream-divider"></div><div class="stream-label">Spanish</div>';
        spanishFeeds.forEach(function(b) {
          var label = (b.homeAway === 'home' ? 'Casa' : 'Visita') + ' — ' + b.callSign;
          var isActive = b.mediaStateCode === 'MEDIA_ON' || b.mediaStateCode === 'MEDIA_ARCHIVE' || game.status.abstractGameState === 'Final';
          var cls = 'stream-item' + (b.mediaId === currentMediaId ? ' active' : '');
          if (isActive) {
            html += '<button class="' + cls + '" onclick="switchStream(\'' + b.mediaId + '\',\'' + b.mediaType + '\')">' + label + '</button>';
          } else {
            html += '<div class="' + cls + '">' + label + '</div>';
          }
        });
      }

      // Highlights
      if (game.status.abstractGameState !== 'Preview') {
        var gameDate = data.gameDate || '';
        var hlUrl = '/highlights?gamePk=' + gamePk + '&gameDate=' + gameDate;
        if (contentProtect) hlUrl += '&content_protect=' + contentProtect;
        html += '<div class="stream-divider"></div>';
        html += '<button class="stream-item" id="hlToggle" onclick="loadHighlights(\'' + hlUrl.replace(/'/g, "\\'") + '\')">Highlights</button>';
        html += '<div id="hlList"></div>';
      }

      // External links: Stream URL, Download, Chromecast, Advanced
      if (currentMediaId) {
        var directUrl = window.location.origin + buildStreamURL(currentMediaId);
        html += '<div class="stream-divider"></div><div class="stream-label">External</div>';
        html += '<a class="stream-item" href="' + directUrl + '" target="_blank">Stream URL</a>';
        html += '<a class="stream-item" href="/download.ts?mediaId=' + currentMediaId + (contentProtect ? '&content_protect=' + contentProtect : '') + '&filename=' + encodeURIComponent(game.away.abbreviation + ' @ ' + game.home.abbreviation) + '">Download</a>';
        html += '<a class="stream-item" href="https://chromecast.link#title=' + encodeURIComponent(game.away.abbreviation + ' @ ' + game.home.abbreviation) + '&content=' + encodeURIComponent(directUrl) + '" target="_blank">Chromecast</a>';
        html += '<a class="stream-item" href="https://hls-js-dev.netlify.app/demo/?src=' + encodeURIComponent(directUrl) + '" target="_blank">Advanced</a>';
      }

      streamList.innerHTML = html;
      if (html) streamToggle.textContent = 'Streams (' + (tvFeeds.length + audioFeeds.length + spanishFeeds.length) + ')';
      else streamPanel.style.display = 'none';

      // Radio feeds
      var radioHtml = '';
      audioFeeds.forEach(function(b) {
        var label = (b.homeAway === 'home' ? 'Home' : 'Away') + ' — ' + b.callSign;
        var isActive = b.mediaStateCode === 'MEDIA_ON' || b.mediaStateCode === 'MEDIA_ARCHIVE' || game.status.abstractGameState === 'Final';
        if (isActive) {
          radioHtml += '<button class="ctrl-btn" onclick="startRadio(\'' + b.mediaId + '\',\'' + b.callSign.replace(/'/g, '') + '\')">' + label + '</button>';
        }
      });
      spanishFeeds.forEach(function(b) {
        var label = (b.homeAway === 'home' ? 'Casa' : 'Visita') + ' — ' + b.callSign;
        var isActive = b.mediaStateCode === 'MEDIA_ON' || b.mediaStateCode === 'MEDIA_ARCHIVE' || game.status.abstractGameState === 'Final';
        if (isActive) {
          radioHtml += '<button class="ctrl-btn" onclick="startRadio(\'' + b.mediaId + '\',\'' + b.callSign.replace(/'/g, '') + '\')">' + label + '</button>';
        }
      });
      if (radioHtml) {
        document.getElementById('radioFeeds').innerHTML = radioHtml;
        document.getElementById('radioControls').style.display = 'flex';
        document.getElementById('radioSep').style.display = '';
      }
    }).catch(function() {});
  } else {
    streamPanel.style.display = 'none';
  }

  // Switch stream
  window.switchStream = function(mediaId, mediaType) {
    currentMediaId = mediaId;
    var url = buildStreamURL(mediaId, mediaType);
    loadStream(url);
    var items = streamList.querySelectorAll('.stream-item');
    items.forEach(function(el) { el.classList.remove('active'); });
    if (event && event.target) event.target.classList.add('active');
    streamList.classList.remove('open');
  };

  // Highlights
  window.loadHighlights = function(url) {
    var hlList = document.getElementById('hlList');
    var hlToggle = document.getElementById('hlToggle');
    if (hlList.children.length > 0) { hlList.innerHTML = ''; hlToggle.textContent = 'Highlights'; return; }
    hlToggle.textContent = 'Loading...';
    fetch(url).then(function(r) { return r.json(); }).then(function(data) {
      if (!Array.isArray(data) || data.length === 0) { hlToggle.textContent = 'No highlights'; return; }
      hlToggle.textContent = 'Highlights (' + data.length + ')';
      var html = '';
      data.forEach(function(h) {
        var title = h.headline || h.title || 'Highlight';
        var hlsUrl = null, mp4Url = null;
        if (h.playbacks) {
          h.playbacks.forEach(function(p) {
            if (p.url && p.url.indexOf('.m3u8') >= 0 && !hlsUrl) hlsUrl = p.url;
            if (p.url && p.url.indexOf('.mp4') >= 0 && !mp4Url) mp4Url = p.url;
          });
        }
        if (hlsUrl) html += '<button class="stream-item" onclick="playHighlight(\'' + hlsUrl.replace(/'/g, "\\'") + '\')" title="' + title.replace(/"/g, '&quot;') + '">' + title + '</button>';
        else if (mp4Url) html += '<a class="stream-item" href="' + mp4Url + '" target="_blank">' + title + ' (MP4)</a>';
      });
      hlList.innerHTML = html;
    }).catch(function() { hlToggle.textContent = 'Highlights (error)'; });
  };

  window.playHighlight = function(url) { loadStream(url); streamList.classList.remove('open'); };

  window.toggleStreamList = function() { streamList.classList.toggle('open'); };

  // Close panels on click outside
  document.addEventListener('click', function(e) {
    if (!streamPanel.contains(e.target)) streamList.classList.remove('open');
    if (!document.getElementById('controls').contains(e.target)) {
      gearPopup.classList.remove('open');
      document.getElementById('radioPopup').style.display = 'none';
    }
  });

  // Radio sync
  var radioAudio = document.getElementById('radioAudio');
  var radioHls = null;
  var radioSyncOffset = 0;
  var radioSyncInterval = null;
  var radioActive = false;

  window.toggleRadioPanel = function() {
    var popup = document.getElementById('radioPopup');
    popup.style.display = popup.style.display === 'none' ? 'block' : 'none';
  };

  window.startRadio = function(mediaId, label) {
    var url = '/stream.m3u8?mediaId=' + mediaId;
    if (contentProtect) url += '&content_protect=' + contentProtect;
    url += '&force_vod=on';

    if (radioHls) { radioHls.destroy(); radioHls = null; }
    clearInterval(radioSyncInterval);

    video.muted = true;
    muteBtn.textContent = 'Unmute Video';
    radioActive = true;

    if (Hls.isSupported()) {
      radioHls = new Hls();
      radioHls.loadSource(url);
      radioHls.attachMedia(radioAudio);
      radioHls.on(Hls.Events.MANIFEST_PARSED, function() {
        radioAudio.play().catch(function() {});
        syncRadioToVideo(true);
      });
    } else {
      radioAudio.src = url;
      radioAudio.play().catch(function() {});
    }

    radioSyncInterval = setInterval(function() { syncRadioToVideo(false); }, 10000);
    document.getElementById('radioStopBtn').style.display = '';
    document.getElementById('radioToggle').textContent = 'Radio: ' + label;

    var btns = document.getElementById('radioFeeds').querySelectorAll('.ctrl-btn');
    btns.forEach(function(b) { b.classList.remove('active'); });
    if (event && event.target) event.target.classList.add('active');

    document.getElementById('radioPopup').style.display = 'none';
  };

  function syncRadioToVideo(force) {
    if (!radioAudio.paused && video.currentTime > 0) {
      var targetTime = video.currentTime + radioSyncOffset;
      var drift = Math.abs(radioAudio.currentTime - targetTime);
      if (drift > 5 || force) {
        radioAudio.currentTime = targetTime;
      } else if (drift > 0.5) {
        radioAudio.playbackRate = radioAudio.currentTime < targetTime ? 1.02 : 0.98;
      } else {
        radioAudio.playbackRate = 1.0;
      }
    }
  }

  window.onRadioSlider = function(val) {
    radioSyncOffset = parseFloat(val);
    document.getElementById('radioSyncDisplay').textContent = radioSyncOffset.toFixed(1) + 's';
  };

  window.stopRadio = function() {
    if (radioHls) { radioHls.destroy(); radioHls = null; }
    radioAudio.pause(); radioAudio.src = '';
    clearInterval(radioSyncInterval);
    radioActive = false;
    video.muted = false;
    muteBtn.textContent = 'Mute';
    document.getElementById('radioStopBtn').style.display = 'none';
    document.getElementById('radioToggle').textContent = 'Radio';
    document.getElementById('radioPopup').style.display = 'none';
    document.getElementById('radioSlider').value = 0;
    radioSyncOffset = 0;
    document.getElementById('radioSyncDisplay').textContent = '0.0s';
    var btns = document.getElementById('radioFeeds').querySelectorAll('.ctrl-btn');
    btns.forEach(function(b) { b.classList.remove('active'); });
  };

  video.addEventListener('pause', function() { if (radioActive) radioAudio.pause(); });
  video.addEventListener('play', function() { if (radioActive) { radioAudio.play().catch(function() {}); syncRadioToVideo(true); } });
  video.addEventListener('seeked', function() { if (radioActive) syncRadioToVideo(true); });

  // Controls
  window.skip = function(seconds) { video.currentTime = Math.max(0, video.currentTime + seconds); };

  window.setRate = function(rate) {
    video.playbackRate = rate;
    rateGroup.querySelectorAll('.ctrl-btn').forEach(function(b) {
      b.classList.toggle('active', parseFloat(b.textContent) === rate);
    });
  };

  window.toggleMute = function() {
    video.muted = !video.muted;
    muteBtn.textContent = video.muted ? 'Unmute' : 'Mute';
    muteBtn.classList.toggle('active', !video.muted);
  };

  window.doAirPlay = function() {
    if (video.webkitShowPlaybackTargetPicker) video.webkitShowPlaybackTargetPicker();
  };

  function updateAudioButtons(activeIndex) {
    audioGroup.querySelectorAll('.ctrl-btn').forEach(function(b, i) {
      b.classList.toggle('active', i === activeIndex);
    });
  }

  window.goBack = function() {
    if (window.history.length > 1) window.history.back();
    else window.location.href = '/';
  };

  // Keyboard
  document.addEventListener('keydown', function(e) {
    switch (e.key) {
      case 'ArrowRight': skip(10); e.preventDefault(); break;
      case 'ArrowLeft': skip(-10); e.preventDefault(); break;
      case 'ArrowUp': video.playbackRate = Math.min(16, Math.round((video.playbackRate + 0.1) * 10) / 10); e.preventDefault(); break;
      case 'ArrowDown': video.playbackRate = Math.max(0.1, Math.round((video.playbackRate - 0.1) * 10) / 10); e.preventDefault(); break;
      case ' ': if (video.paused) video.play(); else video.pause(); e.preventDefault(); break;
    }
  });

  // Auto-hide controls + stream panel on idle
  var hideTimer;
  function showUI() {
    controls.classList.remove('hidden');
    streamPanel.classList.remove('hidden');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function() {
      if (!video.paused) {
        controls.classList.add('hidden');
        streamPanel.classList.add('hidden');
        streamList.classList.remove('open');
        gearPopup.classList.remove('open');
        document.getElementById('radioPopup').style.display = 'none';
      }
    }, 3000);
  }

  document.addEventListener('mousemove', showUI);
  document.addEventListener('touchstart', showUI);
  video.addEventListener('pause', function() { controls.classList.remove('hidden'); streamPanel.classList.remove('hidden'); });
  video.addEventListener('play', function() {
    hideTimer = setTimeout(function() { controls.classList.add('hidden'); streamPanel.classList.add('hidden'); }, 3000);
    if (video.muted && !radioActive) {
      video.muted = false;
      muteBtn.textContent = 'Mute';
      muteBtn.classList.add('active');
    }
  });

  showUI();
})();
</script>
</body>
</html>
